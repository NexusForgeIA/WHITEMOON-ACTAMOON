<body class="arrancando">
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <p class="banner" role="note">
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4 2.5 20h19z M12 10v4 M12 17h.01"/></svg>
    <span id="banner-app"><strong>Demo de presentación con datos ficticios.</strong> No es un sistema oficial ni publica resultados.</span>
    <span id="banner-entrada" hidden><strong>Demo con datos ficticios.</strong> No uses actas reales.</span>
  </p>

  <header class="cabecera">
    <a class="marca" href="#/">
      <img src="assets/img/actamoon-logo.svg" alt="ACTAMOON" width="275" height="64">
    </a>
    <span class="cabecera__ambito" id="ambito"></span>
    <a class="cabecera__perfil" id="perfil-activo" href="#/perfil" hidden></a>
  </header>

  <nav class="nav" aria-label="Principal">
    <ul id="nav-lista" role="list"></ul>
  </nav>

  <main id="contenido" tabindex="-1">
    <noscript><p class="vista">ACTAMOON necesita JavaScript para funcionar.</p></noscript>
  </main>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <footer class="pie">
    <p>Demo de presentación. Datos ficticios, guardados solo en este navegador. Sin cookies ni analítica.</p>
    <p class="pie__contacto" id="pie-contacto" hidden></p>
    <p><a href="#/ayuda">Qué no demuestra esta demo</a></p>
  </footer>

  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <h2 id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div class="dialogo__acciones">
      <button type="button" class="boton boton--secundario" id="dialogo-no" autofocus>Cancelar</button>
      <button type="button" class="boton boton--peligro" id="dialogo-si"></button>
    </div>
  </dialog>
</body>
</html>
